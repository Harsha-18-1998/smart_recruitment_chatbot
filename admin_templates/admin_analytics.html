<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <div class="min-h-screen p-6">
    <h1 class="text-3xl font-bold mb-4 text-indigo-700">📊 Analytics Overview</h1>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-white shadow-lg rounded-xl p-5 border-l-4 border-indigo-500">
        <h2 class="text-sm text-gray-500">Total Users</h2>
        <p class="text-2xl font-bold mt-1">468</p>
        <p class="text-sm text-green-600 mt-2">+12 this week</p>
      </div>

      <div class="bg-white shadow-lg rounded-xl p-5 border-l-4 border-green-500">
        <h2 class="text-sm text-gray-500">Jobs Posted</h2>
        <p class="text-2xl font-bold mt-1">88</p>
        <p class="text-sm text-green-600 mt-2">+5 this week</p>
      </div>

      <div class="bg-white shadow-lg rounded-xl p-5 border-l-4 border-yellow-500">
        <h2 class="text-sm text-gray-500">Interviews Scheduled</h2>
        <p class="text-2xl font-bold mt-1">31</p>
        <p class="text-sm text-gray-500 mt-2">Updated daily</p>
      </div>

      <div class="bg-white shadow-lg rounded-xl p-5 border-l-4 border-purple-500">
        <h2 class="text-sm text-gray-500">AI Matching Accuracy</h2>
        <p class="text-2xl font-bold mt-1">93%</p>
        <p class="text-sm text-gray-500 mt-2">Avg. skill match rate</p>
      </div>
    </div>

    <!-- Charts -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- User Registrations -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-semibold text-indigo-700 mb-4">User Registrations Over Time</h2>
        <canvas id="userChart" height="200"></canvas>
      </div>

      <!-- Job Postings -->
      <div class="bg-white rounded-xl shadow-lg p-6">
        <h2 class="text-lg font-semibold text-green-700 mb-4">Job Postings Trend</h2>
        <canvas id="jobChart" height="200"></canvas>
      </div>
    </div>
  </div>

  <script>
    const userCtx = document.getElementById('userChart').getContext('2d');
    const jobCtx = document.getElementById('jobChart').getContext('2d');

    const userChart = new Chart(userCtx, {
      type: 'line',
      data: {
        labels: ['May', 'June', 'July', 'Aug'],
        datasets: [{
          label: 'Users',
          data: [150, 220, 310, 468],
          borderColor: '#6366F1',
          backgroundColor: 'rgba(99, 102, 241, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false }
        }
      }
    });

    const jobChart = new Chart(jobCtx, {
      type: 'bar',
      data: {
        labels: ['May', 'June', 'July', 'Aug'],
        datasets: [{
          label: 'Jobs',
          data: [40, 55, 72, 88],
          backgroundColor: '#10B981'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              stepSize: 10
            }
          }
        }
      }
    });
  </script>
</body>
</html>
