<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9fafb;
      margin: 0;
      padding: 0;
    }
    .header {
      background-color: #1f2937;
      color: white;
      padding: 15px;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background-color: white;
      padding: 20px;
      flex: 1;
      min-width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-left: 6px solid #2563eb;
    }
    .card h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #4b5563;
    }
    .card p {
      font-size: 1.8rem;
      font-weight: bold;
      margin: 10px 0 0;
      color: #111827;
    }
    .chart-container {
      margin-top: 40px;
      background-color: white;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .btn {
      display: inline-block;
      margin-bottom: 20px;
      background-color: #2563eb;
      color: white;
      padding: 10px 16px;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Admin Analytics Dashboard</h1>
  </div>

  <div class="container">

    <a href="{{ url_for('admin_dashboard') }}" class="btn">← Back to Dashboard</a>

    <div class="stats">
      <div class="card">
        <h3>Total Users</h3>
        <p>{{ total_users }}</p>
      </div>
      <div class="card">
        <h3>Total Jobs</h3>
        <p>{{ total_jobs }}</p>
      </div>
      <div class="card">
        <h3>Total Interviews</h3>
        <p>{{ total_interviews }}</p>
      </div>
      <div class="card">
        <h3>AI Match Accuracy</h3>
        <p>{{ "%.2f"|format(ai_match_accuracy) }}%</p>
      </div>
    </div>

    <div class="chart-container">
      <h2>User Registrations Over Time</h2>
      <canvas id="userChart" height="100"></canvas>
    </div>

    <div class="chart-container" style="margin-top: 40px;">
      <h2>Job Posting Trend</h2>
      <canvas id="jobChart" height="100"></canvas>
    </div>

  </div>

  <script>
    const regDates = JSON.parse('{{ reg_dates|safe }}');
    const regCounts = JSON.parse('{{ reg_counts|safe }}');
    const jobDates = JSON.parse('{{ job_dates|safe }}');
    const jobCounts = JSON.parse('{{ job_counts|safe }}');

    const userCtx = document.getElementById('userChart').getContext('2d');
    const jobCtx = document.getElementById('jobChart').getContext('2d');

    new Chart(userCtx, {
      type: 'line',
      data: {
        labels: regDates,
        datasets: [{
          label: 'User Registrations',
          data: regCounts,
          borderWidth: 2,
          fill: false,
          borderColor: '#3b82f6',
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });

    new Chart(jobCtx, {
      type: 'bar',
      data: {
        labels: jobDates,
        datasets: [{
          label: 'Jobs Posted',
          data: jobCounts,
          backgroundColor: '#10b981',
          borderWidth: 1
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  </script>

</body>
</html>
