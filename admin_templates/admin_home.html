<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Recruit Admin Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            margin: 0;
        }

        .hero-section {
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 40px;
        }

        .hero-section h1 {
            font-size: 3.2rem;
            font-weight: bold;
        }

        .hero-section p {
            font-size: 1.25rem;
            margin-top: 15px;
            max-width: 600px;
        }

        .btn-login {
            margin-top: 35px;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 50px;
            background-color: #ffc107;
            color: #000;
            font-weight: 600;
            border: none;
            transition: 0.3s ease-in-out;
        }

        .btn-login:hover {
            background-color: #e0a800;
            color: white;
        }

        .footer {
            text-align: center;
            padding: 20px;
            background-color: #f1f1f1;
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Hero Section -->
    <div class="hero-section">
        <h1>Smart Recruit Admin Portal</h1>
        <p>Manage job listings, candidates, pipelines, and analytics – all in one place.</p>
        <a href="{{ url_for('admin_login') }}" class="btn btn-login">Admin Login</a>
        <a href="{{ url_for('admin_login') }}" class="btn btn-login">Admin sign up</a>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; {{ now.year }} Smart Recruit. All rights reserved.
    </div>

</body>
</html>
