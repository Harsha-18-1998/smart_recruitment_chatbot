{% extends "admin_base.html" %}

{% block content %}
<h2 class="mb-4">Candidate Pipeline</h2>

<div class="row">
  <!-- Stage 1: Applied -->
  <div class="col-md-3">
    <h5 class="bg-light p-2 text-center">Applied</h5>
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">John Doe</h6>
        <p class="card-text small">Frontend Developer</p>
        <button class="btn btn-sm btn-outline-primary w-100">View</button>
      </div>
    </div>
  </div>

  <!-- Stage 2: Screening -->
  <div class="col-md-3">
    <h5 class="bg-light p-2 text-center">Screening</h5>
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">Jane Smith</h6>
        <p class="card-text small">Product Manager</p>
        <button class="btn btn-sm btn-outline-primary w-100">View</button>
      </div>
    </div>
  </div>

  <!-- Stage 3: Interview -->
  <div class="col-md-3">
    <h5 class="bg-light p-2 text-center">Interview</h5>
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">Alex Johnson</h6>
        <p class="card-text small">Backend Developer</p>
        <button class="btn btn-sm btn-outline-primary w-100">View</button>
      </div>
    </div>
  </div>

  <!-- Stage 4: Offer -->
  <div class="col-md-3">
    <h5 class="bg-light p-2 text-center">Offer</h5>
    <div class="card mb-3">
      <div class="card-body">
        <h6 class="card-title">Samantha Ray</h6>
        <p class="card-text small">UI/UX Designer</p>
        <button class="btn btn-sm btn-outline-primary w-100">View</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
