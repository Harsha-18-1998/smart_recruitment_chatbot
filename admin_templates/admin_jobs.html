<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Management - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function toggleJobs() {
            const jobTable = document.getElementById("jobTable");
            jobTable.classList.toggle("hidden");
        }

        function filterJobs() {
            const input = document.getElementById("jobSearch").value.toLowerCase();
            const rows = document.querySelectorAll("#jobTable tbody tr");
            rows.forEach(row => {
                const title = row.querySelector("td:nth-child(2)").innerText.toLowerCase();
                row.style.display = title.includes(input) ? "" : "none";
            });
        }
    </script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-7xl mx-auto">

        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-blue-700">Job Management</h1>
            <a href="{{ url_for('admin_dashboard') }}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Back to Dashboard</a>
        </div>

        <!-- Add Job Form -->
        <form method="POST" action="{{ url_for('add_job') }}" class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-white p-6 rounded-lg shadow mb-8">
            <input name="job_id" type="text" placeholder="Job ID" required class="border p-2 rounded">
            <input name="title" type="text" placeholder="Title" required class="border p-2 rounded">
            <input name="skills" type="text" placeholder="Skills (comma-separated)" required class="border p-2 rounded">
            <textarea name="description" placeholder="Job Description" class="border p-2 rounded md:col-span-2"></textarea>
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded md:col-span-2 hover:bg-blue-700">Add Job</button>
        </form>

        <!-- Search and Show -->
        <div class="flex items-center justify-between mb-4">
            <input type="text" id="jobSearch" onkeyup="filterJobs()" placeholder="Search job titles..." class="border border-gray-300 p-2 rounded w-1/2">
            <button onclick="toggleJobs()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Show Jobs</button>
        </div>

        <!-- Job Table -->
        <div id="jobTable" class="hidden">
            <table class="w-full bg-white shadow rounded-lg overflow-hidden">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="p-3 text-left">Job ID</th>
                        <th class="p-3 text-left">Job Title</th>
                        <th class="p-3 text-left">Skills</th>
                        <th class="p-3 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for job in jobs %}
                    <tr class="border-t hover:bg-gray-50">
                        <td class="p-3">{{ job['Job_ID'] }}</td>
                        <td class="p-3">{{ job['Job_Title'] }}</td>
                        <td class="p-3">{{ job['Skills'] }}</td>
                        <td class="p-3 space-x-2">
                            <a href="{{ url_for('edit_job', job_id=job['Job_ID']) }}" class="bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600">Edit</a>
                            <form action="{{ url_for('delete_job', job_id=job['Job_ID']) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure you want to delete this job?');">
                                <button type="submit" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
