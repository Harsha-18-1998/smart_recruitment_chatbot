<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Communication Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function toggleSection(id) {
      document.getElementById(id).classList.toggle("hidden");
    }
  </script>
</head>
<body class="min-h-screen font-sans text-gray-800 bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100">

  <!-- Header -->
  <div class="bg-gradient-to-r from-blue-600 via-blue-500 to-blue-400 shadow sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-extrabold text-white tracking-tight">📡 Admin Communication Center</h1>
      <a href="{{ url_for('admin_dashboard') }}" class="bg-white text-blue-700 px-5 py-2 rounded-md font-medium shadow hover:bg-gray-100 transition-all duration-300">← Back to Dashboard</a>
    </div>
  </div>


  <div class="max-w-5xl mx-auto mt-10 px-4 space-y-10">

    <!-- Card -->
    <div class="rounded-xl shadow-xl bg-white/90 border border-gray-200 backdrop-blur-md">

      <!-- Section 1: Send Email -->
      <div class="p-6 border-b border-gray-200">
        <button onclick="toggleSection('emailSection')" class="w-full flex items-center justify-between text-lg font-semibold text-sky-700 hover:text-sky-900">
          <span>📧 1. Send Email to Candidate</span>
          <svg class="w-5 h-5 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="emailSection" class="mt-5 hidden">
          <form class="space-y-4">
            <input type="email" placeholder="Candidate Email" class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-sky-400"/>
            <input type="text" placeholder="Subject" class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-sky-400"/>
            <textarea placeholder="Your message..." rows="4" class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-sky-400"></textarea>
            <button type="submit" class="bg-gradient-to-r from-sky-500 to-blue-500 text-white px-6 py-2 rounded-md hover:from-sky-600 hover:to-blue-600 transition-all">Send Email</button>
          </form>
        </div>
      </div>

      <!-- Section 2: Schedule Interview -->
      <div class="p-6 border-b border-gray-200">
        <button onclick="toggleSection('interviewSection')" class="w-full flex items-center justify-between text-lg font-semibold text-emerald-700 hover:text-emerald-900">
          <span>📅 2. Schedule Interview</span>
          <svg class="w-5 h-5 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="interviewSection" class="mt-5 hidden">
          <form class="space-y-4">
            <input type="text" placeholder="Candidate Name" class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-emerald-400"/>
            <input type="datetime-local" class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-emerald-400"/>
            <input type="url" placeholder="Meeting Link" class="w-full px-4 py-2 border rounded-lg shadow-sm focus:ring-2 focus:ring-emerald-400"/>
            <button type="submit" class="bg-gradient-to-r from-emerald-500 to-green-500 text-white px-6 py-2 rounded-md hover:from-emerald-600 hover:to-green-600 transition-all">Schedule</button>
          </form>
        </div>
      </div>

      <!-- Section 3: View Messages -->
      <div class="p-6">
        <button onclick="toggleSection('messagesSection')" class="w-full flex items-center justify-between text-lg font-semibold text-fuchsia-700 hover:text-fuchsia-900">
          <span>📨 3. Recent Messages</span>
          <svg class="w-5 h-5 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div id="messagesSection" class="mt-5 hidden space-y-4">
          <div class="bg-fuchsia-50 border-l-4 border-fuchsia-400 p-4 rounded-md shadow-sm">
            <p><strong>To:</strong> john@example.com</p>
            <p><strong>Subject:</strong> Interview Confirmation</p>
            <p><strong>Sent on:</strong> August 12, 2025</p>
          </div>
          <div class="bg-fuchsia-50 border-l-4 border-fuchsia-400 p-4 rounded-md shadow-sm">
            <p><strong>To:</strong> alice@example.com</p>
            <p><strong>Subject:</strong> Application Status</p>
            <p><strong>Sent on:</strong> August 10, 2025</p>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
