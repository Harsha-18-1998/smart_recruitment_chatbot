<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen" background-color="blue">

    <!-- Top Navbar -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-600 shadow text-white">
        <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-semibold">Candidate Management</h1>
            <a href="{{ url_for('admin_dashboard') }}" 
               class="bg-white text-blue-600 font-medium px-4 py-2 rounded hover:bg-gray-100 transition">
                ← Back to Dashboard
            </a>
        </div>
    </header>

    <!-- Main Content -->
<main class="max-w-7xl mx-auto py-8 px-6">
    <div class="bg-white shadow-lg rounded-lg p-6 border border-blue-100">
        <h2 class="text-2xl font-bold text-blue-700 mb-4">Registered Candidates</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gradient-to-r from-blue-500 to-indigo-500 text-white text-sm uppercase">
                    <tr>
                        <th class="px-6 py-3 text-left">Name</th>
                        <th class="px-6 py-3 text-left">Email</th>
                        <th class="px-6 py-3 text-left">Register Date</th>
                        <th class="px-6 py-3 text-left">Resume</th>
                        <th class="px-6 py-3 text-left">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-blue-100 text-gray-800 bg-white">
                    {% for user in users %}
                    <tr class="hover:bg-blue-50 transition">
                        <td class="px-6 py-4">{{ user.username }}</td>
                        <td class="px-6 py-4">{{ user.email }}</td>
                        <td class="px-6 py-4">{{ user.registered_on.strftime('%Y-%m-%d') }}</td>
                        <td class="px-6 py-4">
                            {% if user.resume_path %}
                            <a href="{{ url_for('view_resume', user_id=user.id) }}" target="_blank"
                               class="text-blue-600 hover:underline">
                                View
                            </a>
                            {% else %}
                            <span class="text-gray-400 italic">Not uploaded</span>
                            {% endif %}
                        </td>
                        <td class="px-6 py-4">
                            <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST" 
                                  onsubmit="return confirm('Are you sure?');">
                                <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 transition">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>


</body>
</html>
