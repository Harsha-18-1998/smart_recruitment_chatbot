<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Candidate Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold mb-4">Candidate Management</h2>
        <table class="min-w-full bg-white border">
            <thead class="bg-gray-100 text-gray-700 uppercase text-sm">
                <tr>
                    <th class="py-2 px-4 border">Name</th>
                    <th class="py-2 px-4 border">Email</th>
                    <th class="py-2 px-4 border">Register Date</th>
                    <th class="py-2 px-4 border">Resume</th>
                    <th class="py-2 px-4 border">Action</th>
                </tr>
            </thead>
            <tbody class="text-gray-700">
                {% for user in users %}
                <tr class="border-t hover:bg-gray-50">
                    <td class="py-2 px-4 border">{{ user.username }}</td>
                    <td class="py-2 px-4 border">{{ user.email }}</td>
                    <td class="py-2 px-4 border">{{ user.registered_on.strftime('%Y-%m-%d') }}</td>
                    <td class="py-2 px-4 border">
                        {% if user.resume_path %}
                        <a href="{{ url_for('view_resume', user_id=user.id) }}" class="text-blue-600 hover:underline" target="_blank">View</a>
                        {% else %}
                        <span class="text-gray-500">Not uploaded</span>
                        {% endif %}
                    </td>
                    <td class="py-2 px-4 border">
                        <form action="{{ url_for('delete_user', user_id=user.id) }}" method="POST" onsubmit="return confirm('Are you sure?');">
                            <button type="submit" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
