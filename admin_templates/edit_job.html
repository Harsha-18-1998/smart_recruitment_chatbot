<!-- templates/admin_edit_job.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Job</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow-lg p-8">
        
        <!-- Back Button -->
        <div class="mb-6">
            <a href="/admin/jobs" class="inline-flex items-center text-blue-600 hover:text-blue-800 font-semibold">
                ← Back to Jobs
            </a>
        </div>

        <!-- Page Title -->
        <h1 class="text-2xl font-bold text-blue-700 mb-6">Edit Job - {{ job['Title'] }}</h1>

        <!-- Edit Form -->
        <form method="POST" action="/admin/edit_job" class="space-y-5">
            <input type="hidden" name="job_id" value="{{ job['Job ID'] }}">

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
                <input name="title" value="{{ job['Title'] }}" placeholder="Job Title" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Company</label>
                <input name="company" value="{{ job['Company'] }}" placeholder="Company" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                <input name="location" value="{{ job['Location'] }}" placeholder="Location" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Skills</label>
                <input name="skills" value="{{ job['Skills'] }}" placeholder="Skills" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Job Description</label>
                <textarea name="description" placeholder="Description" rows="5" class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" required>{{ job['Description'] }}</textarea>
            </div>

            <div class="text-right">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-md transition duration-200">
                    Update Job
                </button>
            </div>
        </form>
    </div>
</body>
</html>
