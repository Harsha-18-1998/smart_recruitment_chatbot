<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Smart Recruit</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Heroicons for icons -->
  <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

  <!-- Sidebar -->
  <div class="flex h-screen">
    <div class="w-64 bg-white shadow-md">
      <div class="p-6 text-xl font-bold text-blue-700 border-b border-gray-200">Smart Recruit</div>
      <nav class="mt-4">
        <a href="/admin/candidates" class="flex items-center px-6 py-3 hover:bg-gray-200">
          <i data-feather="users" class="mr-3"></i> Candidate Management
        </a>
        <a href="/admin/jobs" class="flex items-center px-6 py-3 hover:bg-gray-200">
          <i data-feather="briefcase" class="mr-3"></i> Job Management
        </a>
        <a href="/admin/analytics" class="flex items-center px-6 py-3 hover:bg-gray-200">
          <i data-feather="bar-chart-2" class="mr-3"></i> Analytics
        </a>
        <a href="/admin/communication" class="flex items-center px-6 py-3 hover:bg-gray-200">
          <i data-feather="message-circle" class="mr-3"></i> Communication Center
        </a>
        <a href="/admin/logout" class="flex items-center px-6 py-3 text-red-600 hover:bg-red-100">
          <i data-feather="log-out" class="mr-3"></i> Logout
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <!-- Topbar -->
      <header class="bg-white border-b border-gray-200 shadow-sm p-4 flex justify-between items-center">
        <div class="text-lg font-semibold text-gray-700">Dashboard</div>
        <div class="flex items-center space-x-4">
          <!-- Notification Bell -->
          <div class="relative">
            <button id="notifBtn" class="focus:outline-none">
              <i data-feather="bell"></i>
            </button>
            <div id="notifDropdown" class="absolute right-0 mt-2 w-64 bg-white border rounded-lg shadow-lg hidden z-50">
              <div class="p-3 text-sm text-gray-700 font-semibold border-b">Recent Registrations</div>
              <ul id="notifList" class="max-h-60 overflow-y-auto text-sm text-gray-600">
                <li class="px-4 py-2 hover:bg-gray-100">No new notifications</li>
              </ul>
            </div>
          </div>

          <!-- Profile Dropdown -->
          <div class="relative">
            <button id="profileBtn" class="focus:outline-none flex items-center space-x-2">
              <img src="https://via.placeholder.com/32" class="rounded-full" />
              <span class="text-sm font-medium text-gray-700">Admin</span>
            </button>
            <div id="profileDropdown" class="absolute right-0 mt-2 w-56 bg-white border rounded-lg shadow-lg hidden z-50">
              <div class="p-4">
                <div class="font-semibold">Admin Profile</div>
                <div class="text-sm text-gray-600 mt-1">admin@example.com</div>
                <div class="mt-4">
                  <button class="w-full text-left text-blue-600 hover:underline text-sm">Edit Profile</button>
                </div>
                <div class="mt-2">
                  <a href="/admin/logout" class="w-full block text-left text-red-600 hover:underline text-sm">Logout</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Dashboard Content Area -->
      <main class="p-6">
        <h2 class="text-2xl font-semibold text-gray-700">Welcome, Admin!</h2>
        <p class="text-gray-500 mt-2">Use the side menu to navigate through your management tools.</p>
      </main>
    </div>
  </div>

  <!-- Toggle Dropdown JS -->
  <script>
    feather.replace();

    document.getElementById('notifBtn').addEventListener('click', function () {
      document.getElementById('notifDropdown').classList.toggle('hidden');
    });

    document.getElementById('profileBtn').addEventListener('click', function () {
      document.getElementById('profileDropdown').classList.toggle('hidden');
    });
  </script>
</body>
</html>
