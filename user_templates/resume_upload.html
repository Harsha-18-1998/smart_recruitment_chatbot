<!-- user_templates/resume_upload.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Resume</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Upload Your Resume</h2>
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('resume_upload') }}">
            <div class="mb-3">
                <label for="resume" class="form-label">Choose a Resume File (PDF or TXT)</label>
                <input class="form-control" type="file" name="resume" id="resume" required accept=".pdf,.txt,.docx">
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
    </div>
</body>
</html>
