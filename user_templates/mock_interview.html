<!-- user_templates/mock_interview.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock Interview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .question-box {
      background-color: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">RecruitBot</a>
    <div class="d-flex">
      <a href="{{ url_for('user_dashboard') }}" class="btn btn-outline-light me-2">Home</a>
      <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center">Mock Interview Practice</h2>
  <form method="POST" action="{{ url_for('mock_interview') }}">
    <div class="mb-3">
      <label for="role" class="form-label">Select Job Role</label>
      <select name="role" class="form-select" required>
        <option value="">-- Choose Role --</option>
        <option value="Software Developer">Software Developer</option>
        <option value="Data Analyst">Data Analyst</option>
        <option value="HR Executive">HR Executive</option>
        <option value="Network Engineer">Network Engineer</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Start Interview</button>
  </form>

  {% if questions %}
    <div class="question-box">
      <h5 class="mb-3">Sample Questions for {{ selected_role }}:</h5>
      <ul class="list-group">
        {% for q in questions %}
          <li class="list-group-item">{{ loop.index }}. {{ q }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
</div>
</body>
</html>
