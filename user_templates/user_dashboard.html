<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - SmartRecruit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #003366;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .navbar .logo {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .navbar .menu a {
            color: white;
            margin-left: 1.5rem;
            text-decoration: none;
            font-weight: 500;
        }

        .navbar .menu a:hover {
            text-decoration: underline;
        }

        .content {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        .welcome {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .chatbot-container {
            background-color: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        #chat-box {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px;
            height: 550px;
            overflow-y: auto;
            background-color: #fefefe;
            margin-bottom: 10px;
        }

        #user-input {
            width: 90%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        #send-button {
            padding: 12px 12px;
            border: none;
            background-color: #003366;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 5px;
        }

        #send-button:hover {
            background-color: #005299;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">SmartRecruit</div>
    <div class="menu">
        <a href="{{ url_for('resume_upload') }}"><i class="fas fa-upload"></i> Resume Upload</a>
        <a href="{{ url_for('mock_interview') }}"><i class="fas fa-comments"></i> Mock Interview</a>
        <a href="{{ url_for('profile') }}"><i class="fas fa-user-circle"></i> Profile</a>
        <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
</div>

<div class="content">
    <div class="welcome">
        Welcome, <strong>{{ session['username'] }}</strong>! Ask me anything about resumes, jobs, interviews, and more.
    </div>

    <div class="chatbot-container">
        <div id="chat-box">
            <div><em>SmartRecruit Bot ready. How can I help you today?</em></div>
        </div>
        <input type="text" id="user-input" placeholder="Type your message here...">
        <button id="send-button" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById("user-input");
        const message = input.value.trim();
        const chatBox = document.getElementById("chat-box");

        if (!message) return;

        chatBox.innerHTML += `<div><strong>You:</strong> ${message}</div>`;

        fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: message })
        })
        .then(res => res.json())
        .then(data => {
            chatBox.innerHTML += `<div><strong>Bot:</strong> ${data.reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        })
        .catch(err => {
            chatBox.innerHTML += `<div><strong>Bot:</strong> Sorry, something went wrong.</div>`;
        });

        input.value = '';
    }
</script>

</body>
</html>
