<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Dashboard - SmartRecruit</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f6f9;
        }

        .navbar {
            background-color: #003366;
            overflow: hidden;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .navbar .logo {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .navbar .menu a {
            color: white;
            margin-left: 1.5rem;
            text-decoration: none;
            font-weight: 500;
        }

        .navbar .menu a:hover {
            text-decoration: underline;
        }

        .content {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        .welcome {
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            color: #333;
        }

        .chatbot-container {
            background-color: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }

        iframe {
            border: none;
            width: 100%;
            height: 400px;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">SmartRecruit</div>
    <div class="menu">
        <a href="{{ url_for('upload_resume') }}"><i class="fas fa-upload"></i> Resume Upload</a>
        <a href="#"><i class="fas fa-user"></i> Mock Interview</a>
        <a href="#"><i class="fas fa-robot"></i>Profile </a>
        <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
        <nav>
            <a href="{{ url_for('logout') }}">Logout</a>
            <a href="{{ url_for('resume_upload') }}">Resume Upload</a>
            <a href="{{ url_for('profile') }}">Profile</a>
            <a href="{{ url_for('mock_interview') }}">Mock Interview</a>
        </nav>

    </div>
</div>

<div class="content">
    <div class="welcome">
        Welcome, <strong>{{ session['username'] }}</strong>! Ask me anything about resumes, jobs, interviews, and more.
    </div>

    <div class="chatbot-container">
        <!-- Embed or integrate your chatbot here -->
        <iframe src="{{ url_for('chat') }}"></iframe>
    </div>
</div>
<nav>
  <a href="{{ url_for('logout') }}">Logout</a>
  <a href="{{ url_for('resume_upload') }}">Resume Upload</a>
  <a href="{{ url_for('profile') }}">Profile</a>
  <a href="{{ url_for('mock_interview') }}">Mock Interview</a>
</nav>

</body>
</html>
