<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Recruitment Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f7fa;
        }

        nav {
            background-color: #003366;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
        }

        nav .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 1.5rem;
            font-size: 1rem;
            transition: color 0.2s;
        }

        nav .nav-links a:hover {
            color: #f0db4f;
        }

        .hero {
            text-align: center;
            padding: 5rem 2rem;
        }

        .hero h1 {
            font-size: 3rem;
            color: #003366;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            color: #444;
        }

        .cta-buttons {
            margin-top: 2rem;
        }

        .cta-buttons a {
            text-decoration: none;
            padding: 0.8rem 1.5rem;
            background-color: #003366;
            color: white;
            border-radius: 5px;
            margin: 0 1rem;
            font-size: 1rem;
            transition: background 0.3s;
        }

        .cta-buttons a:hover {
            background-color: #005599;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #003366;
            color: white;
            margin-top: 5rem;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">SmartRecruit</div>
    <div class="nav-links">
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('signup') }}">Register</a>
    </div>
</nav>

<div class="hero">
    <h1>Welcome to Smart Recruitment Chatbot</h1>
    <p>Your smart companion for job discovery, resume review, and career guidance.</p>

    <div class="cta-buttons">
        <a href="{{ url_for('login') }}">Get Started</a>
        <a href="{{ url_for('signup') }}">Create an Account</a>
    </div>
</div>



<footer>
    &copy; 2025 SmartRecruit. All rights reserved.
</footer>

</body>
</html>
