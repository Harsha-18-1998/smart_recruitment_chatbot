<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Recruit Bot</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
#chat-box {
    height: 400px;
    overflow-y: auto;
    background: white;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
    white-space: pre-wrap; /* preserve line breaks */
}
.user-msg { margin-bottom: 10px; }
.bot-msg { margin-bottom: 10px; }
.user-msg strong, .bot-msg strong { color: #0d6efd; }
</style>
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">Chat with Smart Recruit Bot</h2>
    <div id="chat-box"></div>
    <form id="chat-form" class="input-group mt-3">
        <input id="message" class="form-control" placeholder="Type your message..." required />
        <button class="btn btn-primary" type="submit">Send</button>
    </form>
</div>

<script>
const socket = io();
const chatBox = document.getElementById('chat-box');
const form = document.getElementById('chat-form');
const messageInput = document.getElementById('message');

// Send user message
form.addEventListener('submit', function(e) {
    e.preventDefault();
    const msg = messageInput.value.trim();
    if (!msg) return;

    // Show user message
    const userDiv = document.createElement('div');
    userDiv.className = 'user-msg';
    userDiv.innerHTML = `<strong>You:</strong><br>${msg}`;
    chatBox.appendChild(userDiv);

    socket.emit('user_message', { message: msg });
    messageInput.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;
});

// Receive bot reply
socket.on('bot_reply', function(data) {
    const botDiv = document.createElement('div');
    botDiv.className = 'bot-msg';
    botDiv.innerHTML = `<strong>Bot:</strong><br>${data.message.replace(/\n/g, '<br>')}`;
    chatBox.appendChild(botDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
</body>
</html>
